schema_version: 1

profile:
  id: epson_l3250
  name: Epson L3250
  priority: 50

detection:
  probe:
    - key: sysObjectID
      oid: 1.3.6.1.2.1.1.2.0
      kind: oid
      required: true

    - key: sysDescr
      oid: 1.3.6.1.2.1.1.1.0
      kind: str

    - key: prtGeneralPrinterName
      oid: 1.3.6.1.2.1.43.5.1.1.16.1
      kind: str

  scoring:
    threshold: 80
    rules:
      - name: sysObjectID exact
        when:
          key: sysObjectID
          op: equals
          value: "1.3.6.1.4.1.1248.1.1.2.1.3.5.69.69.80.83.50"
        score: 100
        required: true

      - name: name contains l3250
        when:
          key: prtGeneralPrinterName
          op: contains_ci
          value: "l3250"
        score: 25

sources:
  status_raw:
    oid: 1.3.6.1.2.1.43.5.1.1.3.1
    kind: int

  uptime_raw:
    oid: 1.3.6.1.2.1.1.3.0
    kind: timeticks

  # Printer-MIB: prtMarkerLifeCount (lifetime total pages)
  pagecount_a:
    oid: 1.3.6.1.2.1.43.10.2.1.4.1.1
    kind: int

  # Printer-MIB: prtMarkerPowerOnCount (pages since power on)
  pagecount_since_power_on_raw:
    oid: 1.3.6.1.2.1.43.10.2.1.5.1.1
    kind: int

  sys_name:
    oid: 1.3.6.1.2.1.1.5.0
    kind: str

  model:
    oid: 1.3.6.1.2.1.43.5.1.1.16.1
    kind: str

  serial:
    oid: 1.3.6.1.2.1.43.5.1.1.17.1
    kind: str

  firmware_code_raw:
    oid: 1.3.6.1.2.1.43.15.1.1.6.1.1
    kind: str

supplies:
  enabled: true

  probe:
    index_prefix: "1"
    desc_oid: 1.3.6.1.2.1.43.11.1.1.6
    color_oid: 1.3.6.1.2.1.43.12.1.1.4

  level:
    index_prefix: "1"
    value_oid: 1.3.6.1.2.1.43.11.1.1.9
    max_oid: 1.3.6.1.2.1.43.11.1.1.8
    unit: percent

sensors:
  - key: status
    name_suffix: Status
    source_key: status_raw
    kind: mapped_int
    map:
      "1": other
      "2": unknown
      "3": idle
      "4": printing
      "5": warmup
    default: indisponível
    icon: mdi:printer

  - key: uptime
    name_suffix: Uptime
    source_key: uptime_raw
    kind: timeticks_seconds
    device_class: duration
    state_class: measurement
    unit: s
    icon: mdi:clock-outline

  - key: pagecount_a
    name_suffix: Total Pages
    source_key: pagecount_a
    kind: int
    state_class: total_increasing
    unit: pages
    icon: mdi:file-document-outline

  - key: pagecount_since_power_on
    name_suffix: Pages Since Power On
    source_key: pagecount_since_power_on_raw
    kind: int
    state_class: total_increasing
    unit: pages
    icon: mdi:counter
